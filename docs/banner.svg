<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Gramo — Learn English grammar the Cambridge way — from your own textbook">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset=".6" stop-color="#0d1526"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".22"/></linearGradient>
<linearGradient id="tt" x1="0" x2="1"><stop offset="0" stop-color="#2dd4bf"><animate attributeName="stop-color" values="#2dd4bf;#22d3ee;#2dd4bf" dur="8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<radialGradient id="gl" cx=".2" cy=".1" r=".7"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".28"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
<clipPath id="r"><rect width="1200" height="300" rx="22"/></clipPath>
</defs>
<style>
.grow{transform-box:fill-box;transform-origin:bottom;animation:gr 3.2s ease-in-out infinite alternate}@keyframes gr{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
.slide{animation:sl 4s ease-in-out infinite alternate}@keyframes sl{from{transform:translateX(-10px);opacity:.55}to{transform:none;opacity:1}}
.float{animation:fl 3.6s ease-in-out infinite alternate}@keyframes fl{from{transform:translateY(6px)}to{transform:translateY(-6px)}}
.fill{animation:fi 3s ease-in-out infinite alternate}@keyframes fi{from{width:14px}to{width:var(--w)}}
.in{opacity:0;animation:up .9s ease-out forwards}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#r)">
<rect width="1200" height="300" fill="#0b1020"/><rect width="1200" height="300" fill="url(#bg)"/><rect width="1200" height="300" fill="url(#gr)"/><rect width="1200" height="300" fill="url(#gl)"/>
<g class="in"><text x="76" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="4" fill="#8b98a9">DESKTOP APP · WORKS OFFLINE</text></g>
<text class="in" style="animation-delay:.15s" x="74" y="150" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="-1" fill="url(#tt)">Gramo</text>
<text class="in" style="animation-delay:.3s" x="76" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#c9d1d9">Learn English grammar the Cambridge way — from your own textbook</text>
<g class="in" style="animation-delay:.45s"><rect x="76" y="222" width="100" height="32" rx="11" fill="#2dd4bf" fill-opacity=".13" stroke="#2dd4bf" stroke-opacity=".5"/><text x="126" y="243" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#e6edf3">Electron</text><rect x="186" y="222" width="73" height="32" rx="11" fill="#2dd4bf" fill-opacity=".13" stroke="#2dd4bf" stroke-opacity=".5"/><text x="222" y="243" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#e6edf3">React</text><rect x="269" y="222" width="118" height="32" rx="11" fill="#2dd4bf" fill-opacity=".13" stroke="#2dd4bf" stroke-opacity=".5"/><text x="328" y="243" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#e6edf3">TypeScript</text><rect x="397" y="222" width="82" height="32" rx="11" fill="#2dd4bf" fill-opacity=".13" stroke="#2dd4bf" stroke-opacity=".5"/><text x="438" y="243" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#e6edf3">SQLite</text></g>
<rect class="grow" style="animation-delay:0.00s" x="790" y="210" width="46" height="40" rx="9" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-opacity=".5"/><text x="813" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e6edf3">A1</text><rect class="grow" style="animation-delay:0.18s" x="852" y="184" width="46" height="66" rx="9" fill="#2dd4bf" fill-opacity="0.23" stroke="#2dd4bf" stroke-opacity=".5"/><text x="875" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e6edf3">A2</text><rect class="grow" style="animation-delay:0.36s" x="914" y="158" width="46" height="92" rx="9" fill="#2dd4bf" fill-opacity="0.30" stroke="#2dd4bf" stroke-opacity=".5"/><text x="937" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e6edf3">B1</text><rect class="grow" style="animation-delay:0.54s" x="976" y="132" width="46" height="118" rx="9" fill="#2dd4bf" fill-opacity="0.37" stroke="#2dd4bf" stroke-opacity=".5"/><text x="999" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e6edf3">B2</text><rect class="grow" style="animation-delay:0.72s" x="1038" y="106" width="46" height="144" rx="9" fill="#2dd4bf" fill-opacity="0.44" stroke="#2dd4bf" stroke-opacity=".5"/><text x="1061" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e6edf3">C1</text><rect class="grow" style="animation-delay:0.90s" x="1100" y="80" width="46" height="170" rx="9" fill="#2dd4bf" fill-opacity="0.51" stroke="#2dd4bf" stroke-opacity=".5"/><text x="1123" y="244" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#e6edf3">C2</text><circle r="8" fill="#22d3ee"><animateMotion dur="6s" repeatCount="indefinite" path="M813,196 L875,170 L937,144 L999,118 L1061,92 L1123,66 L1123,66 L813,196" calcMode="linear"/></circle>
</g>
<rect x=".5" y=".5" width="1199" height="299" rx="22" fill="none" stroke="#fff" stroke-opacity=".12"/>
</svg>